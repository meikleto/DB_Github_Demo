name: tester-checklist
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  tester-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Every tester box must be ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section=$(printf '%s\n' "$BODY" | sed -n '/^## Tester checklist/,$p')
          if [ -z "$section" ]; then echo "No '## Tester checklist' section found"; exit 1; fi
          if printf '%s\n' "$section" | grep -qE '^\s*- \[ \]'; then
            echo "Unticked tester items:"
            printf '%s\n' "$section" | grep -E '^\s*- \[ \]'
            exit 1
          fi
          echo "All tester checks ticked"
