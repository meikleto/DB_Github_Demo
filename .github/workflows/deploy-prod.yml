name: deploy-prod
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to redeploy, for rollback (for example v2026.11.20-14)
        required: true

permissions:
  contents: write

concurrency:
  group: prod-target
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
      - run: databricks bundle run -t prod orders_summary
      - name: Tag a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
